name: 功能请求
description: 提出新功能或改进
title: "[Feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        本项目的第一原则是「轻量、独立、像微信截图一样顺手」。
        请说明这个功能是否会让用户必须先装别的软件、或让包体积明显上涨 —— 这两点会直接影响取舍。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 用户在什么场景下做不到什么事（不是「我想要一个 X 按钮」）。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 交互流程 / 快捷键 / 与现有工具条的关系，越具体越好。
    validations:
      required: true

  - type: dropdown
    id: cost
    attributes:
      label: 新增依赖影响
      description: 该功能是否需要引入新的第三方依赖或本地模型？
      options:
        - 不需要新依赖
        - 需要纯 Python 小依赖
        - 需要二进制依赖（可能增大体积）
        - 需要联网调用第三方服务（涉及隐私声明）
        - 需要系统能力（如 OCR 语言包）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与不做的影响
      description: 如果不实现，用户如何绕过？不做会让哪类用户流失？

  - type: dropdown
    id: task
    attributes:
      label: 关联任务
      description: docs/TASKS.md 中的任务号（没有可留空，由项目经理分配）
      options:
        - 已有任务号（请在下方补充）
        - 新需求，暂无任务号
    validations:
      required: true
