version: 2
updates:
  # 应用依赖：只开小版本与补丁，避免 PySide6 大版本升级悄悄改变抓屏/DPI 行为
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: ["dependencies", "triage"]
    groups:
      dev-tools:
        patterns:
          - "ruff"
          - "pytest"
          - "pyinstaller"

  # workflow 自身的行动版本维护
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    labels: ["dependencies", "ci", "triage"]
